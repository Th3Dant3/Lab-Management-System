<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zenni LMS — Google Sign-In</title>
<style>:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050c18;color:#eef5ff;font-family:system-ui,Arial,sans-serif}.wrap{min-height:100dvh;display:grid;place-items:center;padding:20px}.card{width:min(100%,465px);padding:clamp(24px,5vw,38px);background:linear-gradient(145deg,#101c33,#0c1427);border:1px solid #25415e;border-radius:20px;box-shadow:0 20px 60px #0007}h1{font-size:23px;margin:15px 0 10px}p{color:#bdcde0;font-size:14px;line-height:1.65}small{color:#91b4cc}button,a.action{display:block;width:100%;border:0;border-radius:9px;padding:13px;background:linear-gradient(90deg,#3cc4d0,#7b62ea);font-weight:700;color:#fff;text-align:center;text-decoration:none;cursor:pointer;margin-top:16px}button:disabled{opacity:.6;cursor:wait}.mark{font-size:29px}.error{color:#ffbdc3}.ok{color:#55e3ae}.hide{display:none}</style></head>
<body><main class="wrap"><section class="card"><div class="mark" aria-hidden="true">🔐</div><h1>Zenni Workspace Sign-In</h1><p id="status" role="status" aria-live="polite">Checking your signed-in Google Workspace account…</p><p id="detail"></p><button id="retry" class="hide">Check my Google account again</button><a id="go" class="action hide" href="https://th3dant3.github.io/Lab-Management-System/v6-test/index.html">Open LMS Dashboard</a><small>Google controls account selection. Only registered, active Zenni accounts with page access are allowed.</small></section></main>
<script>
(function(){
 const status=document.getElementById('status'),detail=document.getElementById('detail'),retry=document.getElementById('retry'),go=document.getElementById('go');
 function publish(state){
   if(window.opener && !window.opener.closed){
     try{window.opener.postMessage({product:'ZENNI_LMS_V6',type:'AUTH_RESULT',status:state},'https://th3dant3.github.io');}catch(_){}
   }
 }
 function check(){
  retry.classList.add('hide');go.classList.add('hide');status.className='';status.textContent='Verifying Google Workspace identity…';detail.textContent='';
  google.script.run.withSuccessHandler(function(r){
   if(r && r.state==='AUTHORIZED'){
     status.className='ok';status.textContent='Access granted';
     detail.textContent='Your Zenni account has been verified. You may return to the LMS.';
     go.classList.remove('hide');publish('AUTHORIZED');
   } else {
     status.className='error';status.textContent='Access denied';
     detail.textContent='Contact LMS ADMIN to register your Zenni account or request access. If your account is already registered, verify it is active and has LMS page permissions.';
     retry.classList.remove('hide');publish('DENIED');
   }
  }).withFailureHandler(function(err){
    status.className='error';status.textContent='Verification unavailable';
    detail.textContent='Please retry. If the problem continues, contact LMS ADMIN.';
    retry.classList.remove('hide');console.error('Zenni identity verification failed',err);
  }).qaV6PopupCheck();
 }
 retry.addEventListener('click',check);check();
})();
</script></body></html>
