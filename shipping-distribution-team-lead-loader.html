<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shipping Distribution Team Lead</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=DM+Mono:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{height:100vh;overflow:hidden;background:#0a0812;color:#fff;font-family:'Barlow Condensed',sans-serif}
.bg{position:fixed;inset:0;background:
radial-gradient(circle at 18% 18%,rgba(120,73,255,.19),transparent 32%),
radial-gradient(circle at 82% 78%,rgba(255,114,38,.16),transparent 34%),
linear-gradient(135deg,#090711,#0d0a18 55%,#090711)}
.orbit{position:fixed;width:760px;height:760px;border:1px dashed rgba(177,136,255,.1);border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);animation:spin 22s linear infinite}
.orbit:before,.orbit:after{content:"";position:absolute;border:1px dashed rgba(255,132,64,.09);border-radius:50%}
.orbit:before{inset:90px}.orbit:after{inset:180px}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.page{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.shell{width:min(800px,90vw);position:relative}
.routebar{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.dot{width:10px;height:10px;border-radius:50%;background:#9d76ff;box-shadow:0 0 16px #9d76ff}
.dot.orange{background:#ff7a35;box-shadow:0 0 16px #ff7a35}
.segment{height:2px;flex:1;background:linear-gradient(90deg,#9d76ff,#ff7a35);position:relative;overflow:hidden}
.segment:after{content:"";position:absolute;left:-70px;top:-1px;width:70px;height:4px;background:linear-gradient(90deg,transparent,#fff,transparent);animation:ship 1.7s linear infinite}
@keyframes ship{to{left:100%}}
.card{padding:42px 48px;border-radius:26px;border:1px solid rgba(177,136,255,.22);background:linear-gradient(145deg,rgba(24,17,43,.82),rgba(12,10,22,.74));
box-shadow:0 30px 90px rgba(0,0,0,.35),inset 0 0 40px rgba(157,118,255,.035);backdrop-filter:blur(10px)}
.label{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:4px;color:#8f82aa}
.name{font-size:68px;line-height:.95;font-weight:800;text-transform:uppercase;margin:10px 0 7px}
.role{font-size:25px;text-transform:uppercase;letter-spacing:4px;color:#c5adff}
.sub{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;color:#9f93b3;margin-top:6px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:28px 0 24px}
.tile{padding:12px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.025);text-align:center;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1.5px;color:#8f85a1}
.tile span{display:block;font-size:16px;color:#ff8b4e;margin-bottom:4px}
.status{display:flex;justify-content:space-between;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;color:#9389a3;margin-bottom:8px}
.track{height:6px;border-radius:6px;background:#171222;overflow:hidden}
.fill{height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,#7d5cff,#b784ff,#ff7a35);animation:fill 6s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes fill{to{width:100%}}
@media(max-width:650px){.card{padding:32px 24px}.name{font-size:46px}.role{font-size:19px}.tiles{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="bg"></div><div class="orbit"></div>
<div class="page"><div class="shell">
  <div class="routebar"><div class="dot"></div><div class="segment"></div><div class="dot orange"></div><div class="segment"></div><div class="dot"></div></div>
  <div class="card">
    <div class="label">ZENNI LMS · SHIPPING DISTRIBUTION</div>
    <div class="name" id="displayName">Team Lead</div>
    <div class="role">Shipping Distribution Team Lead</div>
    <div class="sub">DISTRIBUTION & INVENTORY · ZENNI USA · OHIO</div>
    <div class="tiles"><div class="tile"><span>01</span>QUEUE</div><div class="tile"><span>02</span>ROUTE</div><div class="tile"><span>03</span>DOCK</div><div class="tile"><span>04</span>DISPATCH</div></div>
    <div class="status"><span id="sysTxt">Preparing distribution network...</span><span id="pct">0%</span></div>
    <div class="track"><div class="fill"></div></div>
  </div>
</div></div>
<script>
const LOADER_MESSAGES=["Preparing distribution network...","Loading shipping distribution data...","Syncing route activity...","Checking dispatch readiness...","Dashboard loading..."];
</script>

<script>
  const n=sessionStorage.getItem("lms_fullname")||"Team Lead";
  document.getElementById("displayName").textContent=n;

  const msgs=LOADER_MESSAGES;
  let p=0;
  const pEl=document.getElementById("pct");
  const sysEl=document.getElementById("sysTxt");
  const iv=setInterval(()=>{
    p=Math.min(99,p+Math.floor(Math.random()*2)+1);
    pEl.textContent=p+"%";
    const idx=Math.min(msgs.length-1,Math.floor(p/20));
    sysEl.textContent=msgs[idx];
    if(p>=99)clearInterval(iv);
  },100);

  const MIN_TIME=6000;
  const startTime=Date.now();
  const preload=document.createElement("link");
  preload.rel="prefetch";
  preload.href="index.html";
  document.head.appendChild(preload);

  function go(){
    const elapsed=Date.now()-startTime;
    const remain=Math.max(0,MIN_TIME-elapsed);
    setTimeout(()=>{
      p=100;pEl.textContent="100%";clearInterval(iv);
      setTimeout(()=>window.location.replace("index.html"),400);
    },remain);
  }
  fetch("index.html",{method:"GET",cache:"force-cache"}).then(go).catch(go);
  setTimeout(()=>window.location.replace("index.html"),10000);
</script>
